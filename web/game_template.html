<style>
  /* touch: no text selection / callout / grey flash on buttons and controls (inputs stay editable) */
  html,body,button,label,.tb,[data-act],[data-app],[data-nav],[data-p]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  button{touch-action:manipulation} input,textarea,select{-webkit-user-select:text;user-select:text}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:ui-monospace,Consolas,monospace;color:#ecfcff;touch-action:manipulation}
  canvas{touch-action:none} #joy,.tb{touch-action:none}
  /* every panel and menu scrolls smoothly with the finger, also in landscape */
  #fleet,#stMenu,#glyUI,#techUI .body,#aos .body,#aos .view,#cust,#fcust,#vsel,#bar,#specs,#fp,#techUI .log{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;scroll-behavior:smooth}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;color:#ff6177}
  .tb{position:fixed;bottom:4vmin;width:16vmin;height:16vmin;border:2px solid rgba(0,255,226,.5);border-radius:50%;
      background:rgba(7,11,19,.35);color:#ecfcff;font:bold 3vmin monospace;display:none;align-items:center;justify-content:center;user-select:none}
  body.touch .tb{display:flex}
  #joy{position:fixed;left:3vmin;bottom:3vmin;width:30vmin;height:30vmin;border-radius:50%;border:2px solid rgba(0,255,226,.45);background:rgba(0,255,226,.06);display:none;z-index:6;touch-action:none}
  body.touch #joy{display:block} #joyK{position:absolute;left:50%;top:50%;width:12vmin;height:12vmin;margin:-6vmin 0 0 -6vmin;border-radius:50%;background:rgba(0,255,226,.35);border:2px solid rgba(0,255,226,.8)}
  body.touch.veh-drone #tdn{display:flex}
  #tdn{display:none!important} body.touch.veh-drone #tdn,body.touch.veh-sub #tdn{display:flex!important}
  #tnx{display:none!important} body.touch.nx #tnx{display:flex!important}
  #tex{display:none!important} body.touch.ex #tex{display:flex!important}
  #tdn{} body.touch.veh-ufo #tdn{display:flex!important} body.touch.veh-foot.jet #tdn{display:flex!important}
  #tfr{display:none!important} body.touch.veh-ufo #tfr{display:flex!important}
  #tgar{display:none!important} body.touch.gar #tgar{display:flex!important}
  body.touch.veh-foot #tn,body.touch.veh-foot #tg,body.touch.veh-foot #tbk{display:flex}
  /* buttons only where they're useful: FLOTTA in the garage or on a fleet vehicle; nothing of the car's on the ODYSSEY bridge */
  #fbtn{display:none} body.gar #fbtn,body.inveh #fbtn{display:block} body.touch.gar #tgar{display:none!important}
  body.touch.helm #th,body.touch.helm #tn,body.touch.eva #tn{display:none!important} body.touch.eva #tdn{display:flex!important} body.touch .tb.nolab{display:none!important}
  body.inship #fbtn{display:none!important}
  #fbtn{position:fixed;right:2vmin;top:2vmin;border:1px solid rgba(0,255,226,.6);background:rgba(7,11,19,.55);color:#ecfcff;font:bold 12px monospace;padding:7px 10px;border-radius:8px;cursor:pointer;z-index:5}
  #fleet{position:fixed;right:2vmin;top:7vmin;max-width:min(560px,94vw);max-height:84vh;overflow:auto;background:rgba(7,11,19,.86);border:1px solid rgba(0,255,226,.6);border-radius:10px;padding:10px 12px;font:12px monospace;display:none;z-index:6}
  #fleet.open{display:block}
  #fleet b{display:block;letter-spacing:.25em;margin-bottom:6px;color:#00ffe2}
  #fleet .ftitle{margin:10px 0 4px;letter-spacing:.2em;opacity:.8}
  #fleet .frow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:4px 0}
  #fleet .frow span{opacity:.7;margin-right:4px}
  #fleet .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:5px}
  #fleet button{background:#101d30;color:#ecfcff;border:1px solid #214557;border-radius:6px;font:11px monospace;padding:6px 8px;cursor:pointer;text-align:left}
  #fleet button.on{background:#00ffe2;color:#04121a;border-color:#00ffe2}
</style>

<script>
(function(){
  const q=new URLSearchParams(location.search);
  let o={palette:'neon',weather:'',paint:'nero',seed:2077,help:true};
  try{Object.assign(o,JSON.parse(localStorage.getItem('neonrun')||'{}'));}catch(e){}
  try{ o.quality=localStorage.getItem('kageQuality')||o.quality||'ultra'; }catch(e){} if(q.has('quality')) o.quality=q.get('quality');
  for(const k of ['palette','weather','paint','power']) if(q.has(k)) o[k]=q.get(k); if(q.has('roof')) o.roof=true; for(const k of ['chrono','fly']) if(q.has(k)) o[k]=true; if(q.has('exhaust')) o.exhaust=q.get('exhaust');
  const save=()=>{try{localStorage.setItem('neonrun',JSON.stringify(o));}catch(e){}};
  const cv=document.getElementById('c'), hud=document.getElementById('hud');
  let game;
  try{ game=new NeonRun.Game(cv,hud,Object.assign(o,{preserve:q.has('shot')})); }
  catch(e){ const er=document.getElementById('err'); er.style.display='flex'; er.textContent='Errore: '+e.message; console.error(e); return; }
  window.__game=game; if(q.has('world')) game.world=q.get('world');
  if(q.has('foot')&&game.foot){ setTimeout(()=>{},0); }
  if(q.has('pos')){ const v=q.get('pos').split(',').map(parseFloat); game.c.x=v[0]; game.c.z=v[1]; game.c.h=v[2]||0; game.cam.h=game.c.h; }
  if(q.has('nexus')&&game.nexus){ game.nexus.active=Nexus0(); game.nexus.st='open'; game.nexus.portal=1; game.nexus.locks=8; }
  function Nexus0(){ return KageNexus.RINGS[0]; }
  if(q.has('view')) game.view=parseInt(q.get('view'));
  function resize(){ const s=Math.min(window.devicePixelRatio||1,2)*(window.__kageScale||1); cv.width=hud.width=Math.round(innerWidth*s); cv.height=hud.height=Math.round(innerHeight*s); }
  addEventListener('resize',resize); resize(); window.__kageResize=resize;
  const inp={gas:false,brake:false,steer:0,hand:false,boost:false};
  const keys={};
  const snd=()=>{ if(game.audio) game.audio.start(); if(game.fleet) game.fleet.audio.start(); };
  // KAGE fleet: drone / boat / galleon (garage panel, races)
  const F=game.fleet, fp=document.getElementById('fleet');
  const labels=()=>{ const k=game.veh?game.veh.kind:(game.foot&&game.foot.active?'foot':'car'); labels.k=k; document.body.className=document.body.className.replace(/\bveh-\w+/g,'')+' veh-'+k;
    const L={car:['GAS','FRENO','DRIFT','N₂O'],drone:['AVANTI','INDIETRO','SU','BOOST'],boat:['GAS','RETRO','—','N₂O'],galleon:['VELE +','VELE −','FUOCO','ASSIST'],moto:['GAS','FRENO','—','BOOST'],hover:['SPINTA','RETRO','—','BOOST'],sub:['AVANTI','INDIETRO','SU','BOOST'],ufo:['AVANTI','INDIETRO','SU','BOOST'],foot:['AVANTI','INDIETRO','SALTA','CORRI']}[k]||['GAS','FRENO','—','BOOST'];
    ['tg','tbk','th','tn'].forEach((id,i)=>{ const el=document.getElementById(id); if(el){ el.textContent=L[i]; el.classList.toggle('nolab',L[i]==='—'); } }); };
  if(F){ F.buildUI(fp,(what,v)=>{ if(what==='vehicle'){ o.vehicle=v; labels(); } if(what==='quality'){ o.quality=v; try{localStorage.setItem('kageQuality',v);}catch(e){} } save(); });
    document.getElementById('fbtn').onclick=e=>{ e.stopPropagation(); F.renderUI(); fp.classList.toggle('open'); };
    fp.addEventListener('pointerdown',e=>e.stopPropagation());
    const want=q.get('vehicle')||(q.has('shot')||q.has('auto')?'car':o.vehicle)||'car';
    if(want!=='car') F.setVehicle(want);
    if(q.has('race')&&game.veh) F.startRace(q.get('race'));
    F.renderUI(); labels();
  } else document.getElementById('fbtn').style.display='none';
  addEventListener('pointerdown',snd); addEventListener('touchstart',snd);
  addEventListener('click',e=>{ if(!game.mono||e.target.closest('button,#fp,#joy,#glyUI,#stMenu,#stUI,#gearUI')) return; game.mono.pick(e.clientX,e.clientY); });
  addEventListener('keydown',e=>{ keys[e.code]=true; snd();
    if(e.code==='KeyN'&&game.nexus) game.nexus.dial();
    if(game.photo&&game.photo.key(e.code)){ e.preventDefault(); return; }
    if(game.editor&&game.editor.keyDown(e.code)){ e.preventDefault(); return; }
    if(game.tech&&game.tech.key(e.code)){ e.preventDefault(); return; }
    if(game.gear&&game.gear.key(e.code)){ e.preventDefault(); return; }
    if(game.star&&game.star.key(e.code)){ e.preventDefault(); return; }
    if(e.code==='Enter'&&game.eras&&game.eras.enter()) return;
    if(e.code==='Enter'&&game.mono&&game.mono.enter()) return;
    if(e.code==='Enter'&&game.star&&game.star.enter()) return;
    if(e.code==='Enter'&&game.xeno&&game.xeno.enter()) return;
    if(e.code==='Enter'&&!game.veh&&game.foot){ game.foot.toggle(); return; }
    if(game.foot&&game.foot.active&&!game.veh){ if(e.code==='KeyG'&&F){ F.renderUI(); fp.classList.toggle('open'); } if(e.code==='KeyC') game.view=(game.view+1)%3; if(e.code==='Space'||e.code.startsWith('Arrow')) e.preventDefault(); return; }
    if(e.code==='KeyO'&&window.getRealSky){ const RS=getRealSky(); RS.setEnabled(!RS.enabled); }
    if(e.code==='KeyB'&&game.audio) game.audio.toggle();
    if(game.veh){
      if(e.code==='KeyG'){ F.renderUI(); fp.classList.toggle('open'); }
      if(e.code==='KeyC') game.view=(game.view+1)%5;
      if(e.code==='Enter'){ if(F.race&&F.race.state!=='finished') F.stopRace(); else F.exitVehicle(); }
      if(e.code==='KeyK'){ if(F.race&&F.race.state!=='finished') F.stopRace(); else F.startRace(F.race?F.race.course.id:undefined); }
      if(e.code==='KeyR') F.respawn();
      if(e.code==='KeyP'){ const ks=Object.keys(CYBER_PALETTES); o.palette=ks[(ks.indexOf(o.palette)+1)%ks.length]; save(); }
      if(e.code==='KeyM'){ const ks=['',...Object.keys(CYBER_WEATHER)]; o.weather=ks[(ks.indexOf(o.weather)+1)%ks.length]; save(); }
      if(e.code==='Space'||e.code.startsWith('Arrow')) e.preventDefault();
      return;
    }
    if(e.code==='KeyG'&&F){ F.renderUI(); fp.classList.toggle('open'); }
    if(e.code==='KeyE'){ const ks=['v8','wankel','mag']; o.power=ks[(ks.indexOf(o.power||'v8')+1)%3]; save(); }
    if(e.code==='KeyT'){ o.roof=!o.roof; save(); }
    if(e.code==='KeyX'){ o.exhaust=o.exhaust==='race'?'serie':'race'; save(); }
    if(e.code==='KeyQ'){ o.chrono=!o.chrono; save(); }
    if(e.code==='KeyF'){ o.fly=!o.fly; save(); }
    if(e.code==='KeyC') game.view=(game.view+1)%NeonRun.VIEWS.length;
    if(e.code==='KeyP'){ const ks=Object.keys(CYBER_PALETTES); o.palette=ks[(ks.indexOf(o.palette)+1)%ks.length]; save(); }
    if(e.code==='KeyM'){ const ks=['',...Object.keys(CYBER_WEATHER)]; o.weather=ks[(ks.indexOf(o.weather)+1)%ks.length]; save(); }
    if(e.code==='KeyV'){ const ks=Object.keys(NeonRun.PAINTS); o.paint=ks[(ks.indexOf(o.paint)+1)%ks.length]; save(); }
    if(e.code==='KeyR'){ Object.assign(game.c,NeonRun.newCar()); if(game.eng) game.eng.refuel(1); }
    if(e.code==='KeyH'){ o.help=!o.help; save(); }
  });
  addEventListener('keyup',e=>{ keys[e.code]=false; });
  // touch buttons
  if('ontouchstart' in window){ document.body.classList.add('touch');
    // on touch screens the prompts name the on-screen buttons instead of the keys
    const C2=CanvasRenderingContext2D.prototype, f0=C2.fillText, m0=C2.measureText, tz=t=>String(t).replace(/\bINVIO ·/g,'AZIONE ·').replace('premi G per','tocca GARAGE per');
    C2.fillText=function(t,...a){ return f0.call(this,tz(t),...a); }; C2.measureText=function(t){ return m0.call(this,tz(t)); }; }
  // directional joystick (left thumb): x = right, y = forward
  const joy={x:0,y:0,id:null}; { const J=document.getElementById('joy'), K=document.getElementById('joyK');
    const upd=(t)=>{ const r=J.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, R0=r.width/2; let dx=(t.clientX-cx)/R0, dy=(cy-t.clientY)/R0; const m=Math.hypot(dx,dy); if(m>1){ dx/=m; dy/=m; }
      joy.x=Math.abs(dx)<0.12?0:dx; joy.y=Math.abs(dy)<0.12?0:dy; K.style.transform='translate('+(dx*R0*0.62)+'px,'+(-dy*R0*0.62)+'px)'; };
    J.addEventListener('touchstart',e=>{ e.preventDefault(); snd(); const t=e.changedTouches[0]; joy.id=t.identifier; upd(t); });
    J.addEventListener('touchmove',e=>{ e.preventDefault(); for(const t of e.changedTouches) if(t.identifier===joy.id) upd(t); });
    const end=e=>{ for(const t of e.changedTouches) if(t.identifier===joy.id){ joy.id=null; joy.x=joy.y=0; K.style.transform=''; } };
    J.addEventListener('touchend',end); J.addEventListener('touchcancel',end); }
  const tb={}; for(const id of ['tl','tr','tg','tbk','th','tn','tv','tdn','tfr']){ const el=document.getElementById(id);
    el.addEventListener('touchstart',e=>{e.preventDefault(); tb[id]=true; if(id==='tv') game.view=(game.view+1)%(game.veh?5:NeonRun.VIEWS.length);});
    el.addEventListener('touchend',e=>{e.preventDefault(); tb[id]=false;}); }
  document.getElementById('tgar').addEventListener('touchstart',e=>{ e.preventDefault(); e.stopPropagation(); if(F){ F.renderUI(); fp.classList.toggle('open'); } });
  document.getElementById('tnx').addEventListener('touchstart',e=>{ e.preventDefault(); snd(); if(game.nexus) game.nexus.dial(); });
  document.getElementById('tex').addEventListener('touchstart',e=>{ e.preventDefault(); if(game.eras&&game.eras.enter()) return; if(game.mono&&game.mono.enter()) return; if(game.star&&game.star.enter()) return; if(game.xeno&&game.xeno.enter()) return; if(game.veh&&F){ F.exitVehicle(); return; } if(game.foot) game.foot.toggle(); });
  /* look around on foot: any finger that isn't on the joystick or a button (also a second finger while the first walks),
     or the mouse dragged on the 3D view: left / right = turn, up / down = tilt. Also on the ODYSSEY decks and on planets. */
  { const looks=new Map(), SKIP='button,.tb,#joy,#aos,#fleet,#stMenu,#glyUI,#techUI,#buildUI,#photoUI,#vega,#gearUI,#stUI,#langPill,input,textarea,label,#techBtn';
    const lookOK=()=>{ const f=game.foot; return f&&f.active&&!game.veh&&!(game.photo&&game.photo.on)&&!(game.aos&&game.aos.isOpen)&&f.ss!=='helm'; };
    addEventListener('pointerdown',e=>{ if(e.target.closest&&e.target.closest(SKIP)) return; if(!lookOK()) return; if(e.pointerType==='mouse'&&e.button!==0) return; looks.set(e.pointerId,{x:e.clientX,y:e.clientY,moved:0}); },true);
    addEventListener('pointermove',e=>{ const L=looks.get(e.pointerId); if(!L||!lookOK()) return; const dx=e.clientX-L.x, dy=e.clientY-L.y; L.x=e.clientX; L.y=e.clientY; L.moved+=Math.abs(dx)+Math.abs(dy);
      const f=game.foot, m=Math.min(innerWidth,innerHeight), ky=-dx/m*3.2, kp=dy/m*2.2; f.lookT=2.5;
      if(f.ss==='in'){ f.lcam=(f.lcam===undefined?f.lh:f.lcam)+ky; } else if(f.ss==='planet'){ f.pcam=(f.pcam===undefined?f.h:f.pcam)+ky; } else if(!f.ss){ f.camH=(f.camH===undefined?f.h:f.camH)+ky; f.camP=Math.max(-0.35,Math.min(1.15,(f.camP===undefined?0.22:f.camP)+kp)); } },true);
    const lend=e=>{ looks.delete(e.pointerId); }; addEventListener('pointerup',lend,true); addEventListener('pointercancel',lend,true); }
  function readInput(){
    inp.gas=keys.KeyW||keys.ArrowUp||tb.tg||joy.y>0.3; inp.brake=keys.KeyS||keys.ArrowDown||tb.tbk||joy.y<-0.3;
    inp.steer=Math.max(-1,Math.min(1,((keys.KeyA||keys.ArrowLeft||tb.tl)?1:0)-((keys.KeyD||keys.ArrowRight||tb.tr)?1:0)-joy.x*1.1));
    inp.hand=keys.Space||tb.th; inp.boost=keys.ShiftLeft||keys.ShiftRight||tb.tn;
    if(game.veh||(game.foot&&game.foot.active)){
      const k=game.veh?game.veh.kind:'foot', b=v=>v?1:0;
      inp.fwd=b(keys.KeyW||keys.ArrowUp||tb.tg)-b(keys.KeyS||keys.ArrowDown||tb.tbk);
      inp.yaw=b(keys.KeyA||keys.ArrowLeft||tb.tl)-b(keys.KeyD||keys.ArrowRight||tb.tr);
      inp.fwd+=joy.y; inp.yaw-=joy.x; inp.strafe=b(keys.KeyE)-b(keys.KeyQ);
      // on foot: move in the direction you push (relative to the camera); Q/E turn the camera
      inp.mx=b(keys.KeyD||keys.ArrowRight)-b(keys.KeyA||keys.ArrowLeft)+joy.x; inp.my=b(keys.KeyW||keys.ArrowUp)-b(keys.KeyS||keys.ArrowDown)+joy.y; inp.joyFull=Math.hypot(joy.x,joy.y)>0.93; inp.cam=b(keys.KeyE)-b(keys.KeyQ);
      inp.lift=k==='drone'||k==='foot'||k==='sub'||k==='ufo'?b(keys.Space||tb.th)-b(keys.KeyX||keys.KeyZ||keys.ControlLeft||tb.tdn):0;
      inp.fire=(k==='galleon'&&(keys.Space||tb.th))||(k==='ufo'&&!!(keys.KeyF||tb.tfr)); inp.boost=!!(keys.ShiftLeft||keys.ShiftRight||tb.tn);
      // gamepad (standard mapping; drone in mode 2: left stick = altitude/yaw, right stick = pitch/roll)
      const gp=navigator.getGamepads?[...navigator.getGamepads()].find(p=>p):null;
      if(gp){ const ax=i=>Math.abs(gp.axes[i]||0)>0.12?gp.axes[i]:0, bt=i=>gp.buttons[i]&&(gp.buttons[i].pressed||gp.buttons[i].value>0.3);
        if(k==='drone'||k==='sub'||k==='ufo'){ inp.lift+= -ax(1); inp.yaw+= -ax(0); inp.fwd+= -ax(3); inp.strafe+= ax(2); }
        else { inp.yaw+= -ax(0); inp.fwd+= (gp.buttons[7]?gp.buttons[7].value:0)-(gp.buttons[6]?gp.buttons[6].value:0)-ax(1)*0; }
        if(bt(5)) inp.boost=true; if(bt(2)) inp.fire=true;
        if(bt(3)&&!readInput.y) game.view=(game.view+1)%5; readInput.y=bt(3);
        if(bt(9)&&!readInput.st&&game.veh){ if(F.race&&F.race.state!=='finished') F.stopRace(); else F.startRace(F.race?F.race.course.id:undefined); } readInput.st=bt(9);
        if(k==='foot'){ if(bt(0)) inp.lift=1; inp.fwd=Math.max(-1,Math.min(1,b(keys.KeyW||keys.ArrowUp||tb.tg)-b(keys.KeyS||keys.ArrowDown||tb.tbk)-ax(1))); }
        inp.fwd=Math.max(-1,Math.min(1,inp.fwd)); inp.yaw=Math.max(-1,Math.min(1,inp.yaw)); inp.lift=Math.max(-1,Math.min(1,inp.lift)); inp.strafe=Math.max(-1,Math.min(1,inp.strafe)); }
    }
  }
  // ?auto=1 → screensaver city run: autopilot, cinematic cameras, no HUD and no engine sound
  let ap=null;
  if(q.has('auto')){
    ap=new NeonRun.Autopilot(); ap.start(game.c); game.view=0;
    if(game.audio){ game.audio.start=()=>{}; game.audio.on=false; }
    hud.style.display='none'; document.body.classList.remove('touch');
    for(const el of document.querySelectorAll('.tb')) el.style.display='none';
    const pick=a=>a[Math.random()*a.length|0];
    o.paint=pick(Object.keys(NeonRun.PAINTS)); o.power=pick(['v8','wankel','mag']); o.exhaust=Math.random()<0.5?'race':'serie'; o.chrono=false; o.fly=false; o.help=false;
    if(q.has('palette')) o.palette=q.get('palette'); if(q.has('weather')) o.weather=q.get('weather');
  }
  // test mode: scripted driving then a single frame
  if(ap&&q.has('shot')){ const T=parseFloat(q.get('t')||'3'); let s; for(let i=0;i<T*30;i++){ s=ap.step(game.c,1/30,null); NeonRun.stepCar(game.c,s,1/30,game.city); game.cam.h=game.c.h; }
    game.view=parseInt(q.get('view')||'0'); game.frame(1/30,s); window.__ap={x:game.c.x,z:game.c.z,h:game.c.h,v:Math.hypot(game.c.vx,game.c.vz),dir:ap.dir}; window.__done=true; return; }
  if(q.has('shot')&&q.has('foot')&&game.foot){ const T=parseFloat(q.get('t')||'2'), vi=JSON.parse(q.get('vin')||'{"fwd":1}'); game.foot.toggle(); game.foot.trans=null; game.foot.y=0;
    if(q.get('gear')){ game.foot.gear=q.get('gear'); game.foot.gv=0; }
    { const sq=q.get('star'), Y=game.star, f=game.foot; if(sq&&Y){ Y.badge=true; const s=Y.ship;
        if(sq==='in'){ f.ss='in'; f.deck=parseInt(q.get('deck')||'1'); const p=(q.get('xl')||'0,12').split(',').map(Number); f.lx=p[0]; f.lz=p[1]; f.lh=parseFloat(q.get('xh')||'0'); f.v=0; Y.syncFoot(f); Y.greetT=5; }
        else if(sq==='helm'){ f.ss='helm'; f.deck=0; f.lx=0; f.lz=11.6; if(q.get('w')==='space'){ Y.toSpace(); s.loc=q.get('loc')||'terra'; } if(q.get('warp')){ s.course=q.get('warp'); if(q.get('wi')) s.warpI=+q.get('wi'); Y.engage(); } if(q.get('cmd')==='takeoff') Y.takeoff(); if(q.get('cmd')==='land') Y.land(); }
        else if(sq==='eva'){ f.ss='eva'; f.ex=30; f.ey=-2; f.ez=30; f.lh=-2.2; f.evx=f.evy=f.evz=0; }
        else if(sq==='planet'){ Y.site=q.get('site')||'marte'; game.world='planet'; f.ss='planet'; f.px=4; f.pz=-8; f.h=0.4; f.py=KageStar.siteHeight(Y.site,4,-8); }
        else if(sq==='garage'){ Y.badge=false; f.x=21.8; f.z=52.8; f.h=1.0; game.view=1; }
        else if(sq==='beam'){ f.ss='beamout'; f.bt=0.9; f.from='city'; } } }
    { const xq=q.get('xeno'), X=game.xeno, f=game.foot; if(xq&&X){ if(xq==='in'){ const p=(q.get('xl')||'0,2').split(',').map(Number); f.xs='in'; f.lx=p[0]; f.lz=p[1]; f.h=X.ship.h+parseFloat(q.get('xh')||'0'); f.v=0; X.syncFoot(f); }
      else if(xq==='vortex') X.tt={phase:'vortex',t:0}; else if(xq==='up'){ const pd=X.toWorld(0,-4.2); f.x=pd[0]; f.z=pd[1]; f.xs='up'; f.xp=0; f.x0=f.x; f.z0=f.z; } else if(xq==='near'){ const pd=X.toWorld(0,-4.2); f.x=pd[0]+6; f.z=pd[1]-8; f.h=-0.6; } else if(xq==='epoch'){ f.x=26; f.z=27; f.h=Math.PI/2; } } }
    for(let i=0;i<T*30;i++){ game.foot.update(1/30,vi); if(game.xeno) game.xeno.update(1/30,vi); if(game.star) game.star.update(1/30,vi); game.t+=1/30; } game.foot.camH=game.foot.h; game.view=parseInt(q.get('view')||'0'); game.frame(1/30,Object.assign({gas:false,brake:false,steer:0},vi));
    window.__fleet={x:game.foot.x,z:game.foot.z,anim:game.foot.anim}; window.__done=true; return; }
  if(q.has('shot')&&game.veh){   // test: simulate the vehicle with a fixed input, then render one frame
    const T=parseFloat(q.get('t')||'3'), vi=JSON.parse(q.get('vin')||'{"fwd":1}'); F.autoMe=!!vi.ai;
    for(let i=0;i<T*30;i++){ const ii=Object.assign({gas:false,brake:false,steer:0},vi); F.update(1/30,ii); game.t+=1/30; }
    if(q.has('exit')){ F.exitVehicle(); for(let i=0;i<parseFloat(q.get('exit'))*30;i++){ game.foot.update(1/30,{}); game.t+=1/30; } }
    if(F.st) F.camH=F.st.h; game.view=parseInt(q.get('view')||'0'); game.frame(1/30,Object.assign({gas:false,brake:false,steer:0},vi));
    window.__fleet={x:F.st.x,y:F.st.y,z:F.st.z,h:F.st.h,v:Math.hypot(F.st.vx,F.st.vz),race:F.race?{state:F.race.state,next:F.race.me.next,lap:F.race.me.lap}:null}; window.__done=true; return; }
  if(q.has('shot')){
    const T=parseFloat(q.get('t')||'3'), steer=parseFloat(q.get('steer')||'0');
    for(let i=0;i<T*30;i++){ const s={gas:!q.has('still'),brake:false,steer:steer,hand:q.has('drift')&&i>T*15,boost:q.has('boost')}; NeonRun.stepCar(game.c,s,1/30,game.city); game.cam.h=game.c.h; if(game.nexus) game.nexus.update(1/30); }
    game.frame(1/30,{gas:true,brake:q.has('brake'),steer:steer,hand:false,boost:false}); window.__done=true; return;
  }
  let prev=performance.now();
  function loop(now){ if(game.power&&!game.power.tick(now)){ requestAnimationFrame(loop); return; } const dt=Math.max(0,Math.min(0.05,(now-prev)/1000)); prev=now;
    if(game.nexus){ const nx=!!game.nexus.near&&game.nexus.st==='idle'; if(nx!==loop.nx){ document.body.classList.toggle('nx',nx); loop.nx=nx; } }
    { const ft=game.foot, xa=(game.eras?game.eras.action():'')||(game.mono?game.mono.action():'')||(game.star?game.star.action():'')||(game.xeno?game.xeno.action():''), ca=game.veh&&F?(F.exitInfo()&&F.exitInfo().spot?'SCENDI':''):ft?(ft.active?((ft.nearCar()||(F&&F.nearParked()))?'SALI':''):(ft.canExit()?'SCENDI':'')):'', lab=xa||ca, ex=!!lab;
      if(ex!==loop.ex){ document.body.classList.toggle('ex',ex); loop.ex=ex; } if(lab&&lab!==loop.lab){ document.getElementById('tex').textContent=tr(lab); loop.lab=lab; }
      const gar=!!(F&&F.inGarage()); if(gar!==loop.gar){ document.body.classList.toggle('gar',gar); loop.gar=gar; }
      { const B=document.body.classList, on=(c,v)=>{ if(B.contains(c)!==v) B.toggle(c,v); }; on('inveh',!!game.veh); on('helm',!!(ft&&ft.active&&ft.ss==='helm')); on('eva',!!(ft&&ft.active&&ft.ss==='eva')); on('inship',!!(ft&&ft.active&&ft.ss)); }
      const jet=!!(ft&&ft.active&&ft.gear==='jet'); if(jet!==loop.jet){ document.body.classList.toggle('jet',jet); loop.jet=jet; const th=document.getElementById('th'); if(th&&labels.k==='foot') th.textContent=jet?'SU':'SALTA'; }
      const lk=game.veh?game.veh.kind:(ft&&ft.active?'foot':'car'); if(lk!==labels.k) labels(); }
    { const gp=navigator.getGamepads?[...navigator.getGamepads()].find(p=>p):null; const b1=gp&&gp.buttons[1]&&gp.buttons[1].pressed; if(b1&&!loop.b1&&game.nexus) game.nexus.dial(); loop.b1=b1; } if(ap) Object.assign(inp,ap.step(game.c,dt,game)); else readInput(); game.frame(dt,inp); requestAnimationFrame(loop); }

  requestAnimationFrame(loop);
})();
