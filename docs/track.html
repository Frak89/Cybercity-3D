<script>/* Cybercity 3D i18n — generated by tools/gen_i18n.py. English by default; IT/EN switch kept in localStorage.
   Translates every canvas text (HUDs) and every DOM text / placeholder, so the pages need no other change. */
(function () {
  'use strict';
  const PAIRS = [["Tutto in un file zip: campagna, alfabeto dei Custodi, programmi e riparazioni di KAGE TECH, pezzi di KAGE BUILD, configurazione dei veicoli e del pilota, impostazioni, foto della Galleria e asset di AmpyOBJ.", "Everything in one zip file: campaign, Custodians' alphabet, KAGE TECH programs and repairs, KAGE BUILD pieces, vehicles and pilot setup, settings, Gallery photos and AmpyOBJ assets."], ["Nessun dispositivo in portata. Avvicinati alla KAGE GT, al veicolo parcheggiato, al KAGE XENO, all’EPOCH nel garage, alla console del NEXUS o sali sulla KAGE ODYSSEY.", "No device in range. Walk up to the KAGE GT, your parked vehicle, the KAGE XENO, the EPOCH in the garage, the NEXUS console, or board the KAGE ODYSSEY."], ["Qui compaiono le tue app AmpyXXX installate sul telefono (AmpyCam, AmpyMaps, AmpyPad, AmpyTube…) e si aprono con un tocco. Funziona nell’app Android di Cybercity 3D.", "Your AmpyXXX apps installed on the phone (AmpyCam, AmpyMaps, AmpyPad, AmpyTube…) appear here and open with a tap. Works in the Cybercity 3D Android app."], ["La storia ricomincia dal prologo e i veicoli tornano da sbloccare. Foto, costruzioni e trofei restano. Fai prima un salvataggio dal tablet se vuoi.", "The story restarts from the prologue and the vehicles are locked again. Photos, builds and trophies stay. Back up from the tablet first if you like."], ["W/S avanti-indietro · A/D gira · Q/E laterale · SPAZIO sali · X scendi · F raggio traente · SHIFT boost · C vista · INVIO lascia i comandi", "W/S forward-back · A/D turn · Q/E strafe · SPACE rise · X descend · F tractor beam · SHIFT boost · C view · ENTER leave the helm"], ["Il seme dorme nel cerchio di pietre. Per svegliarlo devi accendere le tre pietre-guida: quelle che guardano l’alba, il giorno e la notte.", "The seed sleeps in the stone circle. To wake it you must light the three guide stones: those that face the dawn, the day and the night."], ["Scegli un file .zip, oppure .obj + .mtl + texture insieme (selezione multipla). Anche i modelli esportati da qui o da AmpyOBJ Viewer.", "Pick a .zip file, or .obj + .mtl + textures together (multiple selection). Models exported from here or AmpyOBJ Viewer work too."], ["Torna a Cybercity. Nel garage c’è l’EPOCH, la stessa cabina che ti ha portato qui: ora può riportarti indietro, al tempo dei Primi.", "Go back to Cybercity. The EPOCH is in the garage, the same cabin that brought you here: now it can take you back, to the time of the First People."], ["W/S impulso · A/D virata · SPAZIO/X quota · 1-9 / 0 warp · J ingrana · T decolla · L atterra · N rotta · C vista · INVIO alzati", "W/S impulse · A/D yaw · SPACE/X altitude · 1-9 / 0 warp · J engage · T take off · L land · N course · C view · ENTER stand up"], ["A PIEDI · joystick: muoviti (in fondo = corri) · trascina sullo schermo per girare la visuale · SALTA · AZIONE vicino all'auto", "ON FOOT · joystick: move (all the way = run) · drag on the screen to turn the view · JUMP · ACTION near the car"], ["\"Quando avviarlo\" (in carica / sul dock) e il timeout dello schermo. Questo programma regola cosa fa Cybercity da lì in poi.", "\"When to start\" (charging / docked) and the screen timeout. This app controls what Cybercity does from there on."], ["Quella è la tua KAGE GT. Il tablet AmpybiOS è nella tua giacca. Gli altri mezzi te li daremo man mano, quando sarai pronto.", "That's your KAGE GT. The AmpybiOS tablet is in your jacket. You'll get the other vehicles one by one, when you're ready."], ["A PIEDI · WASD / joystick: muoviti · Q/E gira la visuale · SHIFT corri · SPAZIO salta · INVIO vicino all'auto per salire", "ON FOOT · WASD / joystick: move · Q/E turn the camera · SHIFT run · SPACE jump · ENTER near the car to get in"], ["P atmosfera · M meteo · V colore · E propulsione · T capote · X scarico · Q crono · F volo (LEVITA) · B suono · H aiuto", "P atmosphere · M weather · V colour · E power unit · T roof · X exhaust · Q chrono · F flight (LEVITA) · B sound · H help · L language"], ["Ti hanno lasciato un regalo: l’alfabeto completo. Ogni monolite ora è leggibile. Grazie, capitano. — VEGA, KAGE ODYSSEY", "They left you a gift: the complete alphabet. Every monolith can now be read. Thank you, captain. — VEGA, KAGE ODYSSEY"], ["Ogni fascia sceglie cosa mostrare (città con la sua atmosfera, solo orologio, nero o niente) e con che luminosità. ", "Each time slot chooses what to show (city with its atmosphere, clock only, black or nothing) and how bright. "], ["W/S avanti-indietro · A/D ruota · Q/E laterale · SPAZIO su · X giù · SHIFT boost · C vista · G flotta · INVIO gara", "W/S forward-back · A/D yaw · Q/E strafe · SPACE up · X down · SHIFT boost · C view · G fleet · ENTER race"], ["Ricevo un messaggio. È la lingua dei Custodi, ma ora la capisco tutta: «CHI LEGGE QUESTE PAROLE È GIÀ UNO DI NOI».", "I'm receiving a message. It's the language of the Custodians, but now I understand all of it: «WHOEVER READS THESE WORDS IS ALREADY ONE OF US»."], ["Scegli un pezzo: il tablet si chiude e lo piazzi davanti a te (griglia 0,5 m, rotazione 15°). Pezzi tuoi in città:", "Pick a piece: the tablet closes and you place it in front of you (0.5 m grid, 15° turns). Your pieces in the city:"], ["Benvenuto a bordo. Brutte notizie dall’ingegneria: il segnale ha aperto una perdita nel circuito del nucleo warp.", "Welcome aboard. Bad news from engineering: the signal has opened a leak in the warp core circuit."], ["A PIEDI · W/S cammina · A/D gira · Q/E laterale · SHIFT corri · SPAZIO salta · INVIO vicino all'auto per salire", "ON FOOT · W/S walk · A/D turn · Q/E sidestep · SHIFT run · SPACE jump · ENTER near the car to get in"], ["Torna a Cybercity. Nel garage c’è l’EPOCH: entra, viaggia nel tempo e cerca il seme nella prateria del passato.", "Go back to Cybercity. The EPOCH is in the garage: step in, travel in time and look for the seed in the meadow of the past."], ["Ogni monolite ti regala qualche lettera sicura. Leggine altri due, poi prova a decifrare un’intera iscrizione.", "Every monolith gives you a few certain letters. Read two more, then try to decipher a whole inscription."], ["«Su questo mondo dorme il primo seme». Ma il seme non è qui… è stato portato sulla Terra, migliaia di anni fa.", "«On this world sleeps the first seed». But the seed isn't here… it was taken to Earth, thousands of years ago."], ["Anche la tua KAGE GT segnala un guasto. Usa KAGE TECH: DIAG trova il codice, il MANUALE ti dice la procedura.", "Your KAGE GT reports a fault too. Use KAGE TECH: DIAG finds the code, the MANUAL tells you the procedure."], ["Per vedere le notifiche del telefono dai a Cybercity 3D l’accesso alle notifiche (resta tutto sul telefono).", "To see your phone's notifications give Cybercity 3D notification access (everything stays on the phone)."], ["Quella voce sono i Custodi. Da tre notti le loro pietre trasmettono, e tu sei l’unico che riesce a leggerle.", "That voice is the Custodians. For three nights their stones have been transmitting, and you're the only one who can read them."], ["Non ricordi di aver accettato la missione… ma la conosci già. L’hai sognata: le pietre, i simboli, la voce.", "You don't remember accepting the mission… but you already know it. You dreamt it: the stones, the symbols, the voice."], ["W spinta · S retro · A/D timone · SHIFT boost · passa da strada ad acqua · C vista · G flotta · INVIO gara", "W thrust · S reverse · A/D rudder · SHIFT boost · drive from road to water · C view · G fleet · ENTER race"], ["Ogni tanto: giro dell'auto con configurazioni casuali e corsa in città col pilota automatico (senza suono)", "Now and then: a turnaround of the car in random configurations and an autopilot run through the city (no sound)"], ["W/S avanti-indietro · A/D timone · SPAZIO sali · X scendi · SHIFT boost · C vista · G flotta · INVIO gara", "W/S forward-back · A/D rudder · SPACE rise · X dive · SHIFT boost · C view · G fleet · ENTER race"], ["Pilota, mi senti? Sono VEGA, ufficiale scientifica della KAGE ODYSSEY. ARIA mi dice che ti sei svegliato.", "Pilot, can you hear me? This is VEGA, science officer of the KAGE ODYSSEY. ARIA tells me you're awake."], ["Mentre ci sei, dai un’occhiata alle capsule di stasi. Uno dei nostri ospiti parla la lingua dei Custodi.", "While you're there, have a look at the stasis pods. One of our guests speaks the language of the Custodians."], ["Imposta la rotta all’Astrolab o dalla plancia, vai in curvatura e scendi sul pianeta col teletrasporto.", "Set the course at the Astrolab or from the bridge, go to warp and beam down to the planet."], ["W/S issa-ammaina vele · A/D timone · SHIFT assist · SPAZIO cannoni · C vista · G flotta · INVIO regata", "W/S hoist-lower sails · A/D helm · SHIFT assist · SPACE cannons · C view · G fleet · ENTER regatta"], ["Noi siamo i Primi. Custodiamo il seme da quando i Custodi caddero dal cielo, laggiù, oltre la collina.", "We are the First People. We have guarded the seed since the Custodians fell from the sky, over there, beyond the hill."], ["Esegui DIAG per sapere quale sensore, poi CALIBRA seguito dalla sigla del sensore (es. CALIBRA TEMP).", "Run DIAG to find out which sensor, then CALIBRA followed by the sensor code (e.g. CALIBRA TEMP)."], ["RISPARMIO: risoluzione 60%, 30 fps, niente distorsione warp né filtro foto dal vivo, vista più corta.", "SAVER: 60% resolution, 30 fps, no warp distortion or live photo filter, shorter view."], ["Il nucleo è stabile. Ho triangolato il segnale: viene dalla colonia aliena ZHAR’UL, a 37 anni luce.", "The core is stable. I've triangulated the signal: it comes from the alien colony ZHAR’UL, 37 light years away."], ["Scegli un effetto e lo vedi subito sulla città; nell'anteprima il tasto METEO li fa scorrere tutti", "Pick an effect and see it on the city right away; in the preview the WEATHER button cycles through all of them"], ["Ottimo lavoro. Ma ho una cattiva notizia: il segnale sta disturbando le centraline di mezza città.", "Great work. But I have bad news: the signal is disrupting the control units of half the city."], ["Scegli un file cybercity_salvataggio_….zip: i progressi tornano come erano e il gioco si riavvia.", "Pick a cybercity_salvataggio_….zip file: your progress comes back and the game restarts."], ["Stessa rete Wi-Fi, nessun server: vi vedete nella stessa Cybercity, sulla ODYSSEY e sui pianeti.", "Same Wi-Fi network, no server: you see each other in the same Cybercity, on the ODYSSEY and on the planets."], ["FLASH FIRMWARE riscrive il firmware (ci vogliono alcuni secondi: non muoverti dal dispositivo).", "FLASH FIRMWARE rewrites the firmware (it takes a few seconds: stay by the device)."], ["Da tre notti i nostri sensori captano un segnale da Cybercity. Viene da… pietre. Pietre incise.", "For three nights our sensors have picked up a signal from Cybercity. It comes from… stones. Carved stones."], ["I 26 glifi (i primi 21 sono quelli del NEXUS). Azzurro = chiave sicura · ambra = tua ipotesi.", "The 26 glyphs (the first 21 are the NEXUS ones). Blue = certain key · amber = your guess."], ["La terza iscrizione diceva: «cercate la nave sopra le nuvole». Parlano di noi. Della ODYSSEY.", "The third inscription said: «look for the ship above the clouds». They mean us. The ODYSSEY."], ["So che è tutto strano. Ma quello che hai sognato è vero: le pietre esistono, e trasmettono.", "I know it's all strange. But what you dreamt is real: the stones exist, and they're transmitting."], ["Wankel quadrirotore 2.616 cc (4 × 654 cc) a idrogeno · ibrido con motore elettrico assiale", "2,616 cc quad-rotor Wankel (4 × 654 cc) on hydrogen · hybrid with axial electric motor"], ["Propulsione elettromagnetica · 4 sfere a levitazione con motori a flusso assiale integrati", "Electromagnetic drive · 4 levitating spheres with integrated axial-flux motors"], ["Fotocamera vera non disponibile qui. Nell’app Android funziona dopo aver dato il permesso.", "Real camera not available here. In the Android app it works once you grant the permission."], ["VEGA, dalla nave in orbita, ti guiderà. Io resto qui al garage: se ti perdi, torna da me.", "VEGA, from the ship in orbit, will guide you. I'll stay here at the garage: if you get lost, come back to me."], ["Quando parte il salvaschermo lo decide Android: Impostazioni → Display → Salvaschermo → ", "When the screensaver starts is decided by Android: Settings → Display → Screen saver → "], ["Scendi dall’auto, prendi il tablet e vai a guardare il monolite qui vicino. Ti guido io.", "Get out of the car, take your tablet and go look at the monolith nearby. I'll guide you."], ["Nel KAGE GARAGE c’è il modellino della nave con il tuo badge. Indossalo e premi BEAM IN.", "In the KAGE GARAGE there's the ship's model with your badge. Put it on and press BEAM IN."], ["Torna al presente e porta il seme al portale NEXUS. Componi la sequenza e attraversalo.", "Return to the present and take the seed to the NEXUS portal. Dial the sequence and go through."], ["Colonna sonora originale generata dal vivo: cambia con il mondo, l’ora e il cielo vero.", "Original soundtrack generated live: it changes with the world, the time and the real sky."], ["Lo so: un attimo fa eri nella tua cucina. L’EPOCH ti ha portato qui, come era previsto.", "I know: a moment ago you were in your kitchen. The EPOCH brought you here, as planned."], ["2.400 Nm istantanei · vettorializzazione su 360° (le sfere rotolano in ogni direzione)", "2,400 Nm instant · 360° vectoring (the spheres roll in any direction)"], ["Anteprima dal vivo: ogni modifica si vede subito (gli effetti qui partono più spesso)", "Live preview: every change shows immediately (effects start more often here)"], ["Scendi al ponte 5 con l’ascensore e riparalo con KAGE TECH. Senza nucleo niente warp.", "Take the lift down to deck 5 and fix it with KAGE TECH. No core, no warp."], ["Se la modalità Non disturbare (o una modalità Focus/Bedtime) è attiva, niente città", "If Do Not Disturb (or a Focus/Bedtime mode) is on, no city"], ["Ogni guasto ha un codice. DIAG lo trova, qui trovi la procedura. Riparazioni fatte:", "Every fault has a code. DIAG finds it, here you find the procedure. Repairs done:"], ["A BORDO DEL KAGE XENO · esplora la nave · plancia davanti, raggio dietro il nucleo", "ABOARD THE KAGE XENO · explore the ship · bridge ahead, beam behind the core"], ["Serve solo per leggere le icone delle app; nessun contenuto viene letto o salvato.", "Only used to read the app icons; no content is read or stored."], ["Guida tutti i veicoli KAGE (moto, hover, drone, barca, sottomarino, galeone, XENO)", "Drive every KAGE vehicle (bike, hover, drone, boat, sub, galleon, XENO)"], ["Luna, Marte, Alpha Centauri, Proxima b, Kepler-186f, Kepler-452b, colonia Zhar’ul", "Moon, Mars, Alpha Centauri, Proxima b, Kepler-186f, Kepler-452b, Zhar’ul colony"], ["1.020 Nm combinati (rotori 640 Nm a 7.800 giri/min + coppia istantanea elettrica)", "1,020 Nm combined (rotors 640 Nm at 7,800 rpm + instant electric torque)"], ["ULTRA · parti separate come nel gioco · OBJ + MTL + texture palette · un file ZIP", "ULTRA · parts split as in the game · OBJ + MTL + palette texture · one ZIP file"], ["Laggiù c’è un monolite. «Noi veniamo da un mondo senza sole»… forse è casa loro.", "There's a monolith down there. «We come from a world without a sun»… maybe it's their home."], ["Il mio quaderno dei sogni. La mia calligrafia… ma non ricordo di averlo scritto.", "My dream journal. My handwriting… but I don't remember writing this."], ["Tocca un glifo e scegli la lettera. Le parole corte aiutano: «I», «DEL», «LA»…", "Tap a glyph and pick the letter. Short words help: «I», «DEL», «LA»… (the inscriptions are in Italian)"], ["DIAG ti dice quale fusibile (F1–F8): SOSTITUISCI FUSIBILE seguito dal numero.", "DIAG tells you which fuse (F1–F8): SOSTITUISCI FUSIBILE followed by the number."], ["KAGE SCRIPT · un comando per riga · ATTENDI s · RIPETI n … FINE · # commento", "KAGE SCRIPT · one command per line · ATTENDI s (wait) · RIPETI n … FINE (repeat) · # comment"], ["W gas · S freno · A/D piega · SHIFT boost · C vista · G flotta · INVIO gara", "W throttle · S brake · A/D lean · SHIFT boost · C view · G fleet · ENTER race"], ["AI COMANDI · W/S impulso · A/D virata · SPAZIO/X quota · 1-9 · 0 = WARP 10", "AT THE HELM · W/S impulse · A/D yaw · SPACE/X altitude · 1-9 · 0 = WARP 10"], ["W gas · S retro · A/D timone · SHIFT N₂O · C vista · G flotta · INVIO gara", "W throttle · S reverse · A/D helm · SHIFT N₂O · C view · G fleet · ENTER race"], ["Doppia frizione 8 rapporti · trazione integrale e-AWD con torque vectoring", "8-speed dual clutch · e-AWD all-wheel drive with torque vectoring"], ["Se non ripariamo i nostri mezzi non arriveremo mai alla fonte del segnale.", "If we don't fix our machines we'll never reach the source of the signal."], ["Droni KAGE STRIX al posto delle scie volanti, barche e galeone nel canale", "KAGE STRIX drones instead of the flying trails, boats and a galleon on the canal"], ["860 CV a idrogeno + 260 CV elettrici = 1120 CV (824 kW) a 10.200 giri/min", "860 hp hydrogen + 260 hp electric = 1120 hp (824 kW) at 10,200 rpm"], ["Prima SIGILLA CIRCUITO, poi RABBOCCA il refrigerante. Nell’ordine giusto.", "First SIGILLA CIRCUITO (seal), then RABBOCCA (top up). In that order."], ["Fonte: Open-Meteo (gratuito, senza account). Si aggiorna ogni 30 minuti.", "Source: Open-Meteo (free, no account). Updates every 30 minutes."], ["NUCLEO WARP · RIEQUILIBRATO · MATERIA/ANTIMATERIA 1:1 · PRONTO PER WARP", "WARP CORE · REBALANCED · MATTER/ANTIMATTER 1:1 · READY FOR WARP"], ["Prima RESET ATTUATORI, poi TEST ATTUATORI per verificarli e sbloccarli.", "First RESET ATTUATORI, then TEST ATTUATORI to check and free them."], ["Nessuna foto. Usa la Fotocamera (nel gioco o quella vera del telefono).", "No photos yet. Use the Camera (in-game or your phone's real one)."], ["Scegli per ogni funzione se usare il mondo del gioco o il tuo telefono.", "Choose for each function whether to use the game world or your phone."], ["Chiudi la sessione per vederlo nel mondo, o usa la Fotocamera simulata.", "End the session to see it in the world, or use the simulated Camera."], ["L’anno… l’avevo scritto nel quaderno dei sogni: le pietre contano 2087.", "The year… I wrote it in the dream journal: the stones count 2087."], ["Sono ARIA, l’addetta del KAGE GARAGE. Benvenuto a Cybercity. Anno 2087.", "I'm ARIA, the KAGE GARAGE attendant. Welcome to Cybercity. Year 2087."], ["Pilota, mi senti? Sono VEGA, ufficiale scientifica della KAGE ODYSSEY.", "Pilot, can you hear me? This is VEGA, science officer of the KAGE ODYSSEY."], ["«Oltre ECO la città sogna se stessa»… è lì che i Custodi ci aspettano.", "«Beyond ECO the city dreams itself»… that's where the Custodians are waiting."], ["Il caffè è pronto. Ma non riesco a smettere di guardare quella cabina.", "The coffee's ready. But I can't stop staring at that cabin."], ["Prendi il tablet e vai a guardare il monolite qui vicino. Ti guido io.", "Take your tablet and go look at the monolith nearby. I'll guide you."], ["P atmosfera · M meteo · V colore auto · B suono · R riparti · H aiuto", "P atmosphere · M weather · V car colour · B sound · R restart · H help"], ["780 CV termici + 220 CV elettrici = 1000 CV (735 kW) a 8.200 giri/min", "780 hp combustion + 220 hp electric = 1000 hp (735 kW) at 8,200 rpm"], ["Torna a Cybercity (BEAM IN dalla colonia, poi teletrasporto in città)", "Go back to Cybercity (BEAM IN from the colony, then beam down to the city)"], ["non disponibile nel browser: le funzioni reali usano solo le API web", "not available in the browser: real functions use web APIs only"], ["📸 AmpyCam · trascina per girare · due dita / rotella per avvicinarti", "📸 AmpyCam · drag to orbit · two fingers / wheel to get closer"], ["Collegati ai dispositivi: telemetria, funzioni, programmi, diagnosi.", "Connect to devices: telemetry, functions, programs, diagnostics."], ["Sei arrivato da dentro la cabina che canta. Come dicevano le pietre.", "You cam
